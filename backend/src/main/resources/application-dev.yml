spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/folowise_dev}
    username: ${DB_USERNAME:folowise}
    password: ${DB_PASSWORD:folowise}

  jpa:
    show-sql: true

  flyway:
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,flyway
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    try-it-out-enabled: true
