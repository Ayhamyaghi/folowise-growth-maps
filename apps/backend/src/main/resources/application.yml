spring:
  application:
    name: folowise-roadmap

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # Base64-encoded secret — minimum 256 bits (32 bytes decoded) for HS256.
    # Must be supplied via environment variable in all non-dev environments.
    secret: ${JWT_SECRET}
    # Token lifetime in milliseconds. Default: 24 hours.
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
