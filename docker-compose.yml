services:
  postgres:
    image: postgres:16
    container_name: folowise_postgres
    environment:
      POSTGRES_DB: folowise_dev
      POSTGRES_USER: folowise
      POSTGRES_PASSWORD: folowise
    ports:
      - "5432:5432"
    volumes:
      - folowise_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folowise -d folowise_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  folowise_postgres_data:
